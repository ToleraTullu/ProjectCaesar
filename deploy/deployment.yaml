apiVersion: apps/v1
kind: Deployment
metadata:
  name: caesar-app
  namespace: caesar # moved from default → caesar namespace
  labels:
    app: caesar-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caesar-app
  template:
    metadata:
      labels:
        app: caesar-app
    spec:
      containers:
        - name: app
          image: toleratullu/caesar-app:sha-000412b
          ports:
            - containerPort: 8000
          # Expose Kubernetes metadata into the container so the status API can read them
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: APP_VERSION
              value: "1.0.0" # CI workflow can also update this
          # Liveness & readiness probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
