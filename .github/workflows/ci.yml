name: Project Caesar CI/CD

on:
  push:
    branches: ["main"]

# Give the GITHUB_TOKEN permission to push back to the repo
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: clean markdown files
        run: rm !(README.md|*.!(md))

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works properly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/caesar-app
          tags: |
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Deployment Manifest Image Tag
        run: |
          # Configure Git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Build the exact image tag that docker/metadata-action produced
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_IMAGE="${{ secrets.DOCKER_USERNAME }}/caesar-app:sha-${SHORT_SHA}"

          echo "Updating deployment manifest with image: $FULL_IMAGE"

          # Replace the image line in deployment.yaml (handles any existing tag)
          sed -i "s|image: .*caesar-app.*|image: $FULL_IMAGE|g" deploy/deployment.yaml

          # Only commit if the file actually changed
          git add deploy/deployment.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: update image tag to sha-${SHORT_SHA} [skip ci]"
            git push
          fi
