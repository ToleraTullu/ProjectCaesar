name: Project Caesar CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/caesar-app
          tags: |
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile # Adjust path to your Dockerfile if different
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Deployment Manifest Image Tag
        run: |
          # Configure Git credentials to commit back to the repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Get the full image tag generated by metadata-action (e.g., username/caesar-app:sha-1234567)
          IMAGE_TAG="${{ secrets.DOCKER_HUB_USERNAME }}/caesar-app:sha-${{ github.sha }}"
          # Shorten to match the tag format used
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          FULL_IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/caesar-app:sha-${SHORT_SHA}"

          echo "Updating deployment manifest with image: $FULL_IMAGE"

          # Use sed to update the image tag in your deployment.yaml file
          sed -i "s|image: .*|image: $FULL_IMAGE|g" deploy/deployment.yaml

          # Commit and push the updated manifest back to main
          git add deploy/deployment.yaml
          git commit -m "ci: update image tag to ${SHORT_SHA} [skip ci]"
          git push
