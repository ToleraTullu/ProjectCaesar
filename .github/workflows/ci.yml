name: Cleanup files CI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works properly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move HTML to Static Folder
        run: |
          # Configure Git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Move all .html files from the root directory to the static/ folder
          git mv *.html src/static/  || true

          # Add the changed files to Git
          git add src/static/*.html || true

          # Commit the changes
          git commit -m "ci: Move HTML files to static folder [skip ci]" || true

          # Push the changes to the remote repository
          git push origin main || true

      - name: Set up Python
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest
          pip install httpx

      - name: Run Unit Test
        run: |
          PYTHONPATH=.
          pytest testpy/
